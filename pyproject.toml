[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-prefix-cache"
version = "0.1.0"
description = "Shapley-value cost sharing and eviction for shared prefix KV caches in multi-agent LLM systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
model = ["torch>=2.2", "transformers>=4.43", "accelerate"]

[tool.setuptools.packages.find]
include = ["engine*", "policies*", "gametheory*", "workloads*", "experiments*", "analysis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
